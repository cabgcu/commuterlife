# Supabase project configuration
# Docs: https://supabase.com/docs/guides/local-development/cli/config

[project]
id = "jkcfpiuhbtbrgtrususe"

# ── Edge Functions ────────────────────────────────────────────────────────────

[functions.send-push]
verify_jwt = false

[functions.send-password-reset]
verify_jwt = false

# shift-reminders runs every 10 minutes to push shift reminders to workers
# even when no one has the app open.
[functions.shift-reminders]
verify_jwt = false
schedule = "*/10 * * * *"

# timesheet-reminders runs Mondays at 8:00 AM Arizona (15:00 UTC; Arizona has
# no DST) and emails, via Brevo, everyone who missed their position's weekly
# minimum the week before. Each person is emailed at most once per week.
[functions.timesheet-reminders]
verify_jwt = false
schedule = "0 15 * * 1"
